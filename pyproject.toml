[project]
name = "t3a"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "frd-score>=1.0.1",
    "gdown>=5.2.1",
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "monai>=1.5.2",
    "nibabel>=5.3.3",
    "python-dotenv>=1.2.1",
    "rarfile>=4.2",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "timm>=1.0.24",
    "torch>=2.11.0",
    "torchio>=0.21.3",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "umap-learn>=0.5.11",
    "wandb>=0.25.0",
    "wget>=3.2",
    "wilds>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
